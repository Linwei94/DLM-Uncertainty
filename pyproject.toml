[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project]
name = "dlm-uncertainty"
version = "0.1.0"
description = "Diffusion Language Model uncertainty estimation toolkit"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=0.84.0",
    "datasets>=4.6.0",
    "huggingface-hub>=1.4.1",
    "hydra-core>=1.3.2",
    "jinja2>=3.1.6",
    "matplotlib>=3.10.8",
    "numpy>=1.24,<2",
    "omegaconf>=2.3.0",
    "openai>=2.24.0",
    "pandas>=2.0.0",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.6.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "sentence-transformers>=5.2.3",
    "setuptools>=82.0.0",
    "together>=2.2.0",
    "torch>=2.1.1,<2.2",
    "tqdm>=4.67.3",
    "transformers>=4.36.0",
    "vllm>=0.2.5",
]

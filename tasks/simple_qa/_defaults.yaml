seed: 42
dataset_name: simple_qa # must match the folder name under tasks/
dataset_path: basicv8vc/SimpleQA
subset: default
split: test
few_shot_split: test
few_shot_examples: 0
limit: 200

# multiple choice: "question: str", "choices : list", and "answer_index: int"
dataset_preprocessor: task_utils.preprocess_dataset

# placeholder variables must match the dataset column names, formatted using Jinja2
question_format: "{{question.strip()}}"   # question formatting template
prompt_format: |
  Answer the following question using a succinct (at most one sentence) and full answer. 
  {{few_shot_examples}}
  Question: {{formatted_question}}
  Answer:

system_prompt: ""
prompt_formatter: direct_free_form_qa 
generation_type: generation
output_filters: null
confidence_metrics: null
grader: task_utils.simple_qa_llm_grader
performance_metrics:
  - accuracy_scalar_with_abstention
  - ece_scalar
  - auroc_scalar

qa_model:
  backend: vllm 
  name: openai/gpt-oss-20b
  repeat: 1
  stop_sequences: []
  temperature: 0.7
  max_tokens: 512
  max_model_len: 2048
  reasoning_effort: low


grader_model:
  backend: vllm 
  name: openai/gpt-oss-20b
  repeat: 1
  temperature: 0
  max_tokens: 512
  max_model_len: 2048
  reasoning_effort: low